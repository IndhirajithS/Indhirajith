spring.application.name=demo

server.forward-header-strategy=framework

spring.datasource.url=jdbc:mysql://localhost:3306/draftdash?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

springdoc.swagger-ui.use-root-path=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true 
# FIX: Change to the modern Hibernate 6 base dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect